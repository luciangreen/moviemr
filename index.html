<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie MR</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="bar mbar">
    <h1>Movie MR</h1>
    <input id="title" class="title" aria-label="Scene title" value="Untitled scene">
    <span class="spacer"></span>
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="new">New</button>
    <button id="open">Open…</button>
    <button id="save">Save</button>
    <button id="export" class="primary" title="Record the scene as one MP4, with notes and per-frame positions beside it">Make MP4…</button>
  </header>
  <div class="transport" role="toolbar" aria-label="Timeline">
    <button id="play" title="Play (space)">▶</button>
    <input id="time" type="range" min="0" step="0.01" aria-label="Time">
    <span id="tlabel" class="tlabel">0.0 s</span>
    <label>Length <input id="duration" type="number" min="1" max="600" step="0.5" inputmode="decimal"> s</label>
    <label>Size <select id="size"><option value="1280x720">1280 × 720</option><option value="1920x1080">1920 × 1080</option><option value="720x1280">720 × 1280 (tall)</option><option value="1080x1080">1080 × 1080</option></select></label>
    <label>fps <select id="fps"><option>24</option><option>25</option><option>30</option><option>60</option></select></label>
    <span class="sep"></span>
    <button id="addBoard">Add board</button>
    <button id="camPoint" title="Put a camera point here, at this time, from the camera view">Camera point here</button>
    <label class="rec" title="While playing, drag a board in a view to record its movement"><input type="checkbox" id="recMove"> Record movement</label>
    <button id="present" title="Neaten the scene (you'll see the changes first; undo puts it back)">Present</button>
  </div>
  <main class="movie">
    <section class="panel camview">
      <canvas id="cam" width="1280" height="720" aria-label="The camera's view"></canvas>
      <p class="note">The camera's view. Drag in it to look around (Shift: move the camera); the scroll wheel or pinch zooms the lens.</p>
    </section>
    <section class="panel views">
      <div class="view"><b>Top</b><canvas id="top" width="400" height="300" aria-label="Top view: drag to move a board; Shift-drag to turn it"></canvas></div>
      <div class="view"><b>Front</b><canvas id="front" width="400" height="300" aria-label="Front view: drag to move a board up, down and sideways; Shift-drag to spin it"></canvas></div>
      <div class="view"><b>Side</b><canvas id="side" width="400" height="300" aria-label="Side view: drag to move a board forward, back, up and down; Shift-drag to tilt it"></canvas></div>
    </section>
    <aside class="panel side">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div id="inspector"></div>
    </aside>
  </main>
  <form id="say" class="row say"><input id="sayText" type="text" placeholder='Tell Lucian: "add a board called Ann", "move Ann left 1 metre", "note on Ann: character name y, but cute", "make the back wall blue", "present"'><button>Do</button></form>
  <p id="reply" class="quiet" aria-live="polite"></p>
</body>
</html>
